{% extends "base.html" %}

{% block title %}EclipseID · Авторизация{% endblock %}

{% block content %}

<section class="hero" style="justify-content: center; text-align: center;">
    <div class="hero-content" style="max-width: 500px;">
        <div class="badge" style="background: var(--accent-bg); color: var(--accent); border-color: rgba(var(--accent-rgb), 0.15);">
            🔐 Авторизация
        </div>
        <h1 style="font-size: 40px;">
            Вход в систему<br>
            <span>EclipseID</span>

        <p style="margin: 0 auto 40px; max-width: 100%;">
            Авторизация через Discord с привязкой Minecraft UUID
        </p>

        <button class="btn btn-large" onclick="window.location.href='/auth/discord'" style="
            background: #5865F2;
            color: #fff;
            padding: 14px 40px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            transition: all 0.25s ease;
        ">

            </svg>
            Войти через Discord
        </button>

        <p style="margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Автоматическая привязка Minecraft UUID
        </p>
    </div>
</section>

{% endblock %}
