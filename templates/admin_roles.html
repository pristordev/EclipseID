{% extends "base.html" %}

{% block title %}EclipseID · Управление ролями{% endblock %}

{% block extra_css %}
<style>
    .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0 20px; border-bottom: 1px solid var(--border-primary); margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .admin-header h1 { font-size: 28px; font-weight: 700; color: #fff; }
    .admin-header h1 span { color: var(--accent); }
    .btn-primary-action { background: var(--accent); color: var(--bg-primary); padding: 8px 20px; border-radius: 6px; border: none; font-family: inherit; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary-action:hover { background: var(--accent-hover); transform: scale(1.02); }
    .roles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
    .role-card { background: var(--bg-tertiary); border: 1px solid var(--border-secondary); border-radius: 12px; padding: 20px; transition: all 0.3s ease; }
    .role-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .role-card .role-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .role-card .role-name { font-size: 18px; font-weight: 600; color: #fff; }
    .role-card .role-level { font-size: 12px; color: var(--text-tertiary); background: var(--bg-hover); padding: 2px 10px; border-radius: 4px; }
    .role-card .role-display { color: var(--text-secondary); font-size: 14px; margin-bottom: 12px; }
    .role-card .role-perms { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .role-card .role-perms .perm-tag { font-size: 10px; padding: 2px 8px; background: var(--accent-bg); border: 1px solid rgba(var(--accent-rgb), 0.06); border-radius: 3px; color: rgba(255,255,255,0.4); }
    .role-card .role-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-primary); }
    .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .btn-edit { background: var(--accent-bg); color: var(--accent); }
    .btn-edit:hover { background: var(--accent-bg-hover); }
    .btn-delete { background: rgba(255,50,50,0.1); color: #ff4444; }
    .btn-delete:hover { background: rgba(255,50,50,0.2); }
</style>
{% endblock %}

{% block content %}

<div class="admin-header">
    <div>
        <h1>🎖️ <span>Управление ролями</span></h1>
        <div style="color: var(--text-tertiary); font-size: 14px; margin-top: 4px;">Всего ролей: <span id="rolesCount">0</span></div>
    </div>
    <div style="display: flex; gap: 12px;">
        <button class="btn-primary-action" onclick="openCreateModal()">➕ Создать роль</button>
        <a href="/admin" style="background: var(--bg-hover); color: var(--text-secondary); padding: 8px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">← Назад</a>
    </div>
</div>

<div class="roles-grid" id="rolesGrid"></div>

<!-- МОДАЛКА -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2 id="modalTitle">Редактирование роли</h2>
        <div class="modal-sub" id="modalSub">Изменение параметров роли</div>

        <input type="hidden" id="editId">

        <div class="form-group">
            <label>Имя роли (англ)</label>
            <input type="text" id="editName" class="input-field" placeholder="moderator" readonly style="opacity: 0.5;">
        </div>
        <div class="form-group">
            <label>Отображаемое имя</label>
            <input type="text" id="editDisplayName" class="input-field" placeholder="Модератор">
        </div>
        <div class="form-group">
            <label>Уровень (вес)</label>
            <input type="number" id="editLevel" class="input-field" placeholder="10, 50, 100">
        </div>
        <div class="form-group">
            <label>Права (Ctrl+клик для нескольких)</label>
            <select id="editPermissions" multiple class="input-field" style="height: 160px;">
            </select>
        </div>
        <div class="form-group">
            <label>Активна</label>
            <select id="editActive" class="input-field">
                <option value="true">Да</option>
                <option value="false">Нет</option>
            </select>
        </div>

        <div class="modal-actions">
            <button class="btn-save" onclick="saveRole()">💾 Сохранить</button>
            <button class="btn-danger" id="deleteBtn" onclick="deleteRole()">🗑 Удалить</button>
            <button class="btn-cancel" onclick="closeModal()">✕ Отмена</button>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    let roles = [];
    let allPermissions = [];
    let editingId = null;

    async function loadData() {
        try {
            const [rolesRes, permsRes] = await Promise.all([
                fetch('/api/admin/roles/'),
                fetch('/api/admin/roles/permissions')
            ]);
            roles = (await rolesRes.json()).data || [];
            allPermissions = (await permsRes.json()).data || [];
            renderRoles();
            document.getElementById('rolesCount').textContent = roles.length;
        } catch (e) {
            console.error('Ошибка загрузки:', e);
        }
    }

    function renderRoles() {
        const grid = document.getElementById('rolesGrid');
        grid.innerHTML = roles.map(role => `
            <div class="role-card">
                <div class="role-header">
                    <span class="role-name">${role.display_name}</span>
                    <span class="role-level">LVL ${role.level}</span>
                </div>
                <div class="role-display">${role.name}</div>
                <div class="role-perms">
                    ${role.permissions.map(p => `<span class="perm-tag">${p.display_name}</span>`).join('')}
                    ${role.permissions.length === 0 ? '<span style="color: var(--text-muted); font-size: 12px;">Нет прав</span>' : ''}
                </div>
                <div class="role-actions">
                    <button class="btn-sm btn-edit" onclick="openEditModal(${role.id})">✎ Редактировать</button>
                    ${role.name !== 'citizen' && role.name !== 'imperator' ? `<button class="btn-sm btn-delete" onclick="confirmDelete(${role.id})">✕ Удалить</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    function openEditModal(id) {
        const role = roles.find(r => r.id === id);
        if (!role) return;
        editingId = id;

        document.getElementById('modalTitle').textContent = '✎ Редактирование роли';
        document.getElementById('modalSub').textContent = role.display_name;
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = role.name;
        document.getElementById('editName').readOnly = true;
        document.getElementById('editName').style.opacity = '0.5';
        document.getElementById('editDisplayName').value = role.display_name;
        document.getElementById('editLevel').value = role.level;
        document.getElementById('editActive').value = role.is_active ? 'true' : 'false';
        document.getElementById('deleteBtn').style.display = (role.name !== 'citizen' && role.name !== 'imperator') ? 'block' : 'none';

        const permSelect = document.getElementById('editPermissions');
        const rolePermIds = role.permissions.map(p => p.id);
        permSelect.innerHTML = allPermissions.map(p =>
            `<option value="${p.id}" ${rolePermIds.includes(p.id) ? 'selected' : ''}>${p.display_name}</option>`
        ).join('');

        document.getElementById('editModal').classList.add('active');
    }

    function openCreateModal() {
        editingId = null;
        document.getElementById('modalTitle').textContent = '➕ Создание роли';
        document.getElementById('modalSub').textContent = 'Заполните данные';
        document.getElementById('editId').value = '';
        document.getElementById('editName').value = '';
        document.getElementById('editName').readOnly = false;
        document.getElementById('editName').style.opacity = '1';
        document.getElementById('editDisplayName').value = '';
        document.getElementById('editLevel').value = '0';
        document.getElementById('editActive').value = 'true';
        document.getElementById('deleteBtn').style.display = 'none';

        const permSelect = document.getElementById('editPermissions');
        permSelect.innerHTML = allPermissions.map(p =>
            `<option value="${p.id}">${p.display_name}</option>`
        ).join('');

        document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    async function saveRole() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('editName').value.trim();
        const displayName = document.getElementById('editDisplayName').value.trim();
        const level = parseInt(document.getElementById('editLevel').value) || 0;
        const active = document.getElementById('editActive').value === 'true';
        const permSelect = document.getElementById('editPermissions');
        const permIds = Array.from(permSelect.selectedOptions).map(opt => opt.value);

        if (!displayName) { alert('Введите отображаемое имя'); return; }

        try {
            const url = id ? `/api/admin/roles/${id}` : '/api/admin/roles/';
            const method = id ? 'PUT' : 'POST';

            let query;
            if (id) {
                query = `?display_name=${encodeURIComponent(displayName)}&level=${level}&is_active=${active}&permissions=${permIds.join(',')}`;
            } else {
                if (!name) { alert('Введите имя роли (англ)'); return; }
                query = `?name=${encodeURIComponent(name)}&display_name=${encodeURIComponent(displayName)}&level=${level}&permissions=${permIds.join(',')}`;
            }

            const res = await fetch(url + query, { method });
            if (res.ok) {
                closeModal();
                await loadData();
            } else {
                const err = await res.json();
                alert('Ошибка: ' + (err.detail || ''));
            }
        } catch (e) {
            alert('Ошибка соединения');
        }
    }

    function confirmDelete(id) {
        if (confirm('Удалить роль?')) deleteRole(id);
    }

    async function deleteRole(id) {
        const targetId = id || document.getElementById('editId').value;
        if (!targetId) return;
        try {
            const res = await fetch(`/api/admin/roles/${targetId}`, { method: 'DELETE' });
            if (res.ok) {
                closeModal();
                await loadData();
            } else {
                const err = await res.json();
                alert('Ошибка: ' + (err.detail || ''));
            }
        } catch (e) {
            alert('Ошибка соединения');
        }
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    document.getElementById('editModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeModal();
    });

    loadData();
</script>
{% endblock %}
